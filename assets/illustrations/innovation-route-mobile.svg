<svg xmlns="http://www.w3.org/2000/svg" width="380" height="700" viewBox="0 0 380 700" role="img" aria-labelledby="mobile-route-title mobile-route-description">
  <title id="mobile-route-title">Recorrido de la innovación en cuatro etapas</title>
  <desc id="mobile-route-description">Versión vertical del recorrido: identificar un activo intangible, elegir su protección, analizar su madurez tecnológica y preparar acuerdos de transferencia.</desc>
  <rect width="380" height="700" fill="#f5f7f1"/>
  <path d="M25 35h330M25 665h330" stroke="#d7dfd0"/>
  <path d="M25 29v12m330-12v12M25 659v12m330-12v12" stroke="#365229" stroke-width="1.5"/>
  <path d="M62 112v145m0 12v145m0 12v145" fill="none" stroke="#365229" stroke-opacity=".38" stroke-width="2"/>

  <g fill="#e6f0d7" stroke="#365229" stroke-width="1.8">
    <circle cx="62" cy="112" r="32"/>
    <circle cx="62" cy="269" r="32"/>
    <circle cx="62" cy="426" r="32"/>
    <circle cx="62" cy="583" r="32"/>
  </g>

  <g fill="none" stroke="#365229" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
    <circle cx="62" cy="112" r="17" stroke-opacity=".65"/>
    <path d="m49 116 9-14 8 11 10-13m-19 18 7-10 12 11"/>
    <path d="M53 255h16l8 8v22H53zm16 0v9h8m-18 1h10m-10 5h10"/>
    <path d="M48 442v-19m9 19v-11m9 11v-18m9 18v-26m-27 0h27"/>
    <path d="m51 417 8 5 8-8 9-7"/>
    <path d="m45 575 17-9 17 9v18l-17 9-17-9zm0 0 17 10 17-10m-17 10v18"/>
  </g>
  <g fill="#8dbf36">
    <circle cx="58" cy="102" r="2.8"/>
    <circle cx="66" cy="113" r="2.8"/>
    <circle cx="76" cy="100" r="2.8"/>
    <circle cx="59" cy="419" r="2.8"/>
    <circle cx="67" cy="424" r="2.8"/>
    <circle cx="76" cy="416" r="2.8"/>
  </g>

  <g fill="#365229" font-family="'Atkinson Hyperlegible', Arial, sans-serif">
    <text x="112" y="78" font-size="12" font-weight="700" letter-spacing="1.3">01 · DESCUBRIR</text>
    <text x="112" y="111" fill="#30362d" font-size="19" font-weight="700">Activo intangible</text>
    <text x="112" y="137" fill="#596156" font-size="13">Identificar invenciones, marcas</text>
    <text x="112" y="157" fill="#596156" font-size="13">y conocimiento.</text>

    <text x="112" y="235" font-size="12" font-weight="700" letter-spacing="1.3">02 · PROTEGER</text>
    <text x="112" y="268" fill="#30362d" font-size="19" font-weight="700">Elegir protección</text>
    <text x="112" y="294" fill="#596156" font-size="13">Definir figuras y territorios</text>
    <text x="112" y="314" fill="#596156" font-size="13">de interés.</text>

    <text x="112" y="392" font-size="12" font-weight="700" letter-spacing="1.3">03 · EVALUAR</text>
    <text x="112" y="425" fill="#30362d" font-size="19" font-weight="700">Madurez tecnológica</text>
    <text x="112" y="451" fill="#596156" font-size="13">Analizar el nivel de preparación</text>
    <text x="112" y="471" fill="#596156" font-size="13">de la tecnología (TRL).</text>

    <text x="112" y="549" font-size="12" font-weight="700" letter-spacing="1.3">04 · TRANSFERIR</text>
    <text x="112" y="582" fill="#30362d" font-size="19" font-weight="700">Preparar acuerdos</text>
    <text x="112" y="608" fill="#596156" font-size="13">Licencias, negociación</text>
    <text x="112" y="628" fill="#596156" font-size="13">y colaboración.</text>
  </g>
</svg>
