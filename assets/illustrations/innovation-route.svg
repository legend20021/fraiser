    <circle cx="676" cy="156" r="43" fill="#e6f0d7" stroke-width="2"/>
    <path d="M655 180v-35m14 35v-19m14 19v-29m14 29v-42m-43 42h50" stroke-width="2"/>
    <path d="m657 144 14 8 14-14 12-10" stroke="#89bcce" stroke-width="2.5"/>
