<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="route-title route-description">
  <title id="route-title">Cuatro etapas del recorrido de una innovación</title>
  <desc id="route-description">Identificar un activo intangible, elegir cómo protegerlo, analizar su madurez tecnológica y preparar acuerdos para transferir tecnología.</desc>
