  <g fill="#596156" font-family="'Atkinson Hyperlegible', Arial, sans-serif">
    <text x="70" y="96" font-size="12" font-weight="700" letter-spacing="1.6">01 · DESCUBRIR</text>
    <text x="342" y="96" font-size="12" font-weight="700" letter-spacing="1.6">02 · PROTEGER</text>
    <text x="614" y="96" font-size="12" font-weight="700" letter-spacing="1.6">03 · EVALUAR</text>
    <text x="886" y="96" font-size="12" font-weight="700" letter-spacing="1.6">04 · TRANSFERIR</text>
  </g>

  <g fill="#30362d" font-family="'Atkinson Hyperlegible', Arial, sans-serif">
    <text x="66" y="239" font-size="19" font-weight="700">Activo intangible</text>
    <text x="66" y="268" font-size="13">Identificar invenciones, marcas</text>
    <text x="66" y="288" font-size="13">y conocimiento.</text>

    <text x="338" y="239" font-size="19" font-weight="700">Protección</text>
    <text x="338" y="268" font-size="13">Elegir figuras y territorios</text>
    <text x="338" y="288" font-size="13">de interés.</text>

    <text x="610" y="239" font-size="19" font-weight="700">Madurez tecnológica</text>
